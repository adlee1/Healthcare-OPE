rule_version = "k-source-vocabulary-negative-space-v1-proposed"
specified_on = "2026-10-12"
specified_after = "Query 200 five-source lexical and one-hop local-code closure"
specified_before = ["Query 201 real database execution", "product inclusion policy", "episode or dose extraction", "formal cohort", "model training", "LLM patient-data calls", "downstream performance metrics"]
author_setting_recovered = false
formal_source_policy_enabled = false
formal_product_identity_enabled = false

unresolved_dependencies = [
  "D005 semantic-key product adjudication",
  "D005 accepted IV potassium source policy",
  "D005 source rows to recorded delivered action",
  "D005 same-anchor and adjacent episode rule",
  "D005 zero-action opportunity",
  "D003 formal non-ICU interval",
  "D003 formal label",
]

[paper_facts]
target_intervention = "IV potassium"
action_values_meq = [0, 10, 20, 40]
salt_or_product_scope_disclosed = false
source_fields_disclosed = false
product_identity_rule_disclosed = false
episode_rule_disclosed = false
zero_action_rule_disclosed = false
kcl_is_complete_paper_scope = false

[discovery_universe]
source_fields = [
  "mimiciv_hosp.emar.medication",
  "mimiciv_hosp.emar_detail.product_description",
  "mimiciv_hosp.pharmacy.medication",
  "mimiciv_hosp.prescriptions.drug",
]
enumerate_all_non_null_distinct_values = true
sampling = false
normalization = "trim-collapse-whitespace-lowercase-for-review-only"
normalization_establishes_product_identity = false
local_product_code_is_ndc = false
complete_text_vocabulary_proves_intervention_coverage = false

[execution]
transaction_isolation = "repeatable read"
transaction_read_only = true
statement_timeout_ms = 120000
same_snapshot_required = true
explicit_rollback_required = true
clean_psql_exit_required = true
persist_private_values_only_after_rollback = true
private_file_mode = "0600"
print_controlled_vocabulary_values = false
emit_patient_identifiers_or_times = false

[lexical_review]
mutually_exclusive_strata = [
  "blank_after_trim",
  "focal_kcl_repletion_hint",
  "broader_phosphate_or_acetate_repletion_hint",
  "other_potassium_salt_review",
  "non_repletion_active_drug_hint",
  "unresolved_potassium_lexical_review",
  "no_declared_potassium_lexical_signal",
]
retain_independent_boolean_hints = true
strata_are_inclusion_rules = false
no_lexical_signal_is_exclusion = false
focal_kcl_hint_is_product_identity = false

[q200_baseline]
candidate_emar_heads = 719059
query199_direct_head_scope = 559191
heads_new_beyond_direct_name = 159868
identity_unresolved_only_heads = 472
source_vocabulary_rows = 237
seed_local_product_codes = 27
detail_code_dictionary_names = 38
nonexact_admission_link_heads = 16523
q200_audit_checks = 18952
q200_audit_failures = 0
discovery_array_lengths = [23, 79, 45, 52]

[acceptance]
q200_discovery_arrays_are_exact_source_subsets = true
q200_artifact_hashes_must_match = true
source_values_unique_within_each_field = true
every_value_has_exactly_one_review_stratum = true
strata_conserve_each_source_and_global_totals = true
private_vocabulary_artifact_required = true
public_summary_aggregate_only = true
unknown_or_conflicting_identity_fails_closed = true

[change_control]
selection_must_not_depend_on = ["paper_sample_size", "action_distribution", "label_coverage", "model_accuracy", "ope_error", "agreement_with_paper_figures"]
downstream_artifacts_must_record = ["component_id", "rule_version", "config_sha256"]
changing_discovery_contract_invalidates = ["Query 201 full vocabulary artifact", "source-policy ledger", "episode and action extraction", "cohort flow", "labels", "models", "OPE results"]

[guards]
product_identity_decided = false
final_source_policy = false
complete_intervention_coverage = false
formal_action = false
formal_episode = false
zero_action_constructed = false
formal_non_icu_rule = false
formal_label = false
formal_cohort = false
patient_data_exported = false
llm_called = false

