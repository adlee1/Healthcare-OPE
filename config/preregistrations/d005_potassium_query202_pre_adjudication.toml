  "infusion_rate_unit",
  "infusion_complete",
  "completion_interval",
  "new_iv_bag_hung",
  "continued_infusion_in_other_location",
  "restart_interval",
  "non_formulary_visual_verification",
]
detail_to_head_identity_checked_with = ["subject_id", "emar_id", "emar_seq"]
no_detail_and_detail_head_identity_conflict_counts_retained = true
