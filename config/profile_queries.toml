completeness = "All Started/Delayed Started/Restarted records linked to deduplicated exact-name saline orders. Inventory retains identity problems; lab matching requires consistent subject/admission IDs and known anchor time. Candidate serum sodium items 50983/52623 only: pre window [t-4h,t), observed storetime <= t availability, next sampling time strictly >t without maximum lag, all ties retained. Location is at anchor time, not full treatment/observation eligibility. Presence is not numeric validity; roles overlap and one lab may match multiple anchors. No final cohort or infusion-end outcome rule."

[[queries]]
