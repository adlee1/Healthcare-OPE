schema_version = 1

[[queries]]
name = "potassium_medication_scope"
file = "sql/profiling/199_potassium_medication_scope.sql"
scope = "aggregate"
max_rows = 10000
work_mem_mb = 128
description = "Full potassium-token medication-name, status, link and order-route scope audit"
completeness = "No sampling. A monotone existing-index walk enumerates all non-NULL eMAR medication names, then retrieves every head whose name contains potassium or a bounded KCl token. Raw and normalized selected names, neutral ingredient strata, event-status classes and identity-validated order-route patterns are reported with direct per-scope distinct counts. Pharmacy rows and prescription components are independently preaggregated by pharmacy_id before the head join, so component multiplicity cannot expand eMAR heads. NULL medication heads are counted but their product rows are not examined; unrecognized brands, nonlexical product sources and combination products outside the declared name scope remain uncovered. Order routes do not prove administration. No eMAR detail/product identity, source inclusion policy, dose, action, zero action, episode, non-ICU rule, label or cohort is constructed. No patient identifiers, timestamps, laboratory values or patient text are emitted."

[[queries]]
name = "potassium_assumed_rate_lab_timing"
file = "sql/profiling/198_potassium_assumed_rate_lab_timing.sql"
scope = "aggregate"
max_rows = 10000
work_mem_mb = 128
description = "Fixed-rate proxy clock and potassium lab-selector timing sensitivity audit"
completeness = "Recomputes the conservative 194 candidates over the same fixed SYSTEM 1 percent eMAR page sample and restricts the proxy analysis to the 10/20/40 mEq paper-value candidates. eMAR charttime is only an administration-record anchor; the assumed 10 mEq/hour clock, proxy end and end-plus-three-hour target are unobserved sensitivity-analysis constructs. First-after and nearest selectors choose specimen charttime before any value, unit or storetime quality assessment and retain every row tied at every selected timestamp; nearest retains all equidistant timestamp groups. Latest-valid-available selectors use only the declared charttime/storetime availability gate, with no-end-gate and strict-post-proxy-end variants reported separately. Post-selection quality separates missing from nonfinite values and reports timestamp-group finite-value conflicts and 50971/52610 item patterns without emitting values. Lag summaries and fixed buckets use selected timestamp groups only; no-selected-timestamp candidate-selector rows remain exhaustively reported by selector_status and are not part of the lag denominator. Intervening-candidate counts cover only conservative candidates found in the fixed 1 percent page sample, so their coverage is explicitly incomplete. No identifiers, timestamps or lab values are emitted. The page sample is not representative or shared with another statement, no maximum lag is imposed, no selector is adopted or recovered as the paper label, and no actual dose or action, observed treatment start or end, episode, cohort, formal non-ICU rule, feature or label is constructed."

[[queries]]
name = "potassium_candidate_record_chains"
file = "sql/profiling/197_potassium_candidate_record_chains.sql"
scope = "aggregate"
max_rows = 10000
work_mem_mb = 128
description = "Candidate-specific full eMAR pharmacy and strict-POE timestamp-group evidence"
completeness = "Recomputes the conservative 194 source candidates over the same fixed SYSTEM 1 percent eMAR page sample, then retrieves complete eMAR streams for each distinct candidate pharmacy_id and only fully identity-consistent prescription/POE keys. Previous, anchor and first strictly later timestamp groups retain every tie and do not skip Confirmed, another administration/start, nonterminal, Not Given or unknown states to find a later stop. Candidate detail completion/rate fields, pharmacy/prescription start-stop controls and POE pointers are diagnostics only. The same-admission sequence covers only sampled candidate anchors, not complete medication history. No gap threshold, episode, observed start/end, rate integral, delivered dose, zero action, formal non-ICU rule, label or cohort is constructed."

[[queries]]
name = "potassium_candidate_intersection"
file = "sql/profiling/196_potassium_candidate_intersection.sql"
scope = "aggregate"
max_rows = 10000
work_mem_mb = 128
description = "Single-statement potassium source-dose candidate, location and lab intersection audit"
completeness = "Same fixed SYSTEM 1 percent eMAR page sample and seed as 194/195. One read-only statement recomputes the conservative 194 source-dose candidates and intersects them at event level with 195-style anchor-point and full [anchor-4h,anchor) transfer coverage, pre-anchor potassium/creatinine availability, and first strictly post-anchor potassium diagnostics. Any-finite stages are diagnostic existence checks only: they do not select a unique value or establish feature or label eligibility. Parent completeness evidence remains explicit-negative versus unknown; lab units, timestamp ties, missing/nonfinite values and storetime anomalies remain explicit. The component sum is not accepted actual dose or action, 60/80 mEq remain outside the paper action values, and no zero action, treatment episode or endpoint, formal non-ICU rule, baseline feature rule, post-infusion label or cohort is constructed."

[[queries]]
name = "potassium_dose_candidates"
file = "sql/profiling/194_potassium_dose_candidates.sql"
scope = "aggregate"
max_rows = 10000
work_mem_mb = 128
description = "Potassium event-level component-dose evidence and conservative source-candidate states"
completeness = "Same exact-name SYSTEM 1 percent seed as 191/192 with complete detail and independent route evidence. Product dose_given components are summed only when every component is numeric, strictly positive mEq and structural/identity checks pass; explicit-IV evidence with a TAB/PKT product form is blocked. Parent dose_due remains planned amount evidence. Parent completion flags are canonical; product-row flags are anomalies, and missing/other is not negative. Exact 60/80 and other positive sums remain outside the paper action values; zero, Not Given and missing rows never create the zero action. Description-strength consistency uses a finite local vocabulary, not an external label or NDC. Candidate issues overlap and must not be summed. No actual dose, episode merge, non-ICU rule, label or formal action accepted."

[[queries]]
name = "potassium_time_location_lab"
file = "sql/profiling/195_potassium_time_location_lab.sql"
scope = "aggregate"
max_rows = 10000
work_mem_mb = 128
description = "Potassium administration-anchor, pre-four-hour location and K/creatinine lab availability audit"
completeness = "Same exact-name SYSTEM 1 percent seed as 191/192. eMAR charttime is an administration-record anchor, not a validated infusion start or end. Anchor-point and full [anchor-4h,anchor) transfer coverage use half-open intervals and preserve ICU, gaps, overlap, unknown and invalid records. Complete provisional non-ICU coverage means every atomic time segment has exactly one named non-ICU interval and may include a contiguous change between named non-ICU careunits. Pre-window Blood/Chemistry K 50971/52610 and creatinine 50912/52546 require same non-NULL subject/admission and separately report storetime availability; availability does not guarantee a finite numeric value. The first K specimen timestamp strictly after the anchor has no maximum lag and retains all ties across both K itemids; it is not a post-infusion label. Prescription/detail time fields are diagnostics only. No dose, episode, formal non-ICU cohort or label rule accepted."

[[queries]]
name = "potassium_product_semantics"
file = "sql/profiling/192_potassium_product_semantics.sql"
scope = "aggregate"
max_rows = 10000
work_mem_mb = 128
description = "Potassium component-dose, parent due and description-strength consistency diagnostics"
completeness = "Same exact-name SYSTEM 1 percent seed as 191 with complete details and independent route evidence. Finite observed product-description dictionary only; strength is not externally label-verified. Parent dose_due, individual product dose_given, component sums and description-strength times product_amount stay distinct diagnostic quantities, never accepted actual doses. Repeated values alone are not duplicates. Ordinal/code counts, identity/time/pharmacy failures, incomplete-dose and remainder flags are retained. Unmapped descriptions, code values, identifiers, patient times and raw free text are not output. No final cohort or action mapping."

[[queries]]
name = "potassium_source_coverage"
file = "sql/profiling/193_potassium_source_coverage.sql"
scope = "aggregate"
max_rows = 10000
work_mem_mb = 128
description = "Full eMAR potassium-token/KCl source-name and head-order coverage"
completeness = "No sampling. A monotone existing-index walk enumerates non-NULL medication names; selected potassium/KCl lexical names retrieve all matching heads. Two exact names, other lexical names and their union have independent distinct counts, not additive subject/admission totals. Other active ingredients and route-name hints are vocabulary diagnostics only. Unique pharmacy keys and preaggregated prescription components prevent head multiplication; route evidence requires identity agreement but remains order evidence, not actual IV administration. No detail rows, dose, location or outcome eligibility examined. Unrecognized brands/synonyms outside literal scope are not exhausted; no cohort accepted."

