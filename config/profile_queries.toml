completeness = "Exact-name saline prescription candidates; comparisons use consistent subject/admission and known event times. Pharmacy, strictly consistent POE, and admission-wide temporal streams remain separate. Unknown states, ties, omitted identities and unknown times are flagged. POE discontinue pointers describe orders and never supply actual treatment stop times. Same-POE additional eMAR coverage is diagnostic only and is not merged into endpoints. NULL POE records are not pooled; no final event merging or cohort rule adopted."

[[queries]]
name = "potassium_route_dose_sample"
