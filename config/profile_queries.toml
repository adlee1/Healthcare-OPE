scope = "aggregate"
max_rows = 5000
work_mem_mb = 128
description = "Complete potassium sample details with independent route identity and dose-duplication evidence"
completeness = "Same SYSTEM 1 percent seed and two exact trimmed eMAR labels as 190; not population counts. Complete details joined by emar_id; route evidence from head/detail pharmacy and prescriptions is aggregated independently, preserving subject/admission/sequence failures. mL never establishes IV; TAB/PKT conflicts and all statuses remain visible. Repeated product doses are not summed into actual dose. Strict single-product Administered/IV/mEq compatibility is a source candidate only; identity, product meaning, infusion timing, non-ICU and final actions are not collectively validated."

[[queries]]
name = "saline_closed_windows"
file = "sql/profiling/188_saline_closed_windows.sql"
scope = "aggregate"
max_rows = 5000
work_mem_mb = 128
description = "Closed saline candidate intervals, full location coverage, endpoint labs and other start records"
completeness = "Candidate construction matches 185 exactly; no cross-order merge. Whole treatment and context-plus-treatment windows use atomic transfer intervals; treatment-to-post-end-lab windows exist only when a post-end lab exists. Stop/lab point locations are separate from half-open intervals and retain potentially relevant invalid transfers. Earliest labs strictly after start/end retain all ties and missing numeric values; mEq/L is the diagnostic candidate unit, other nonempty units stay unverified without conversion. Additional starts cover only the exact-drug candidate entry path, not all concurrent treatments; order-linked identity anomalies are retained conservatively even when the event admission is missing or conflicting. Diagnostic first-flag flow is a declared exploratory ordering, not an accepted cohort or verified actual dose. Distinct counts across groups/windows/roles are not additive."

[[queries]]
name = "saline_order_families"
file = "sql/profiling/189_saline_order_families.sql"
scope = "aggregate"
max_rows = 10000
work_mem_mb = 32
description = "Explicit POE replacement graph and actual eMAR endpoint comparisons"
completeness = "Exact-drug orders with consistent prescription/pharmacy/POE identity form finite connected components using explicit discontinue pointers. Relations describe order lineage, not infusion continuity. Only actual identity-consistent eMAR controls supply endpoints. Reciprocal/one-way edges, cycles, branches, omitted heads, unknown times/statuses, shared-POE extra heads and overlapping record spans remain explicit. Extra same-POE heads are coverage-only and conservatively flag the whole family. Recursive UNION has no silent depth truncation; timeout fails. No actual dose or cohort accepted."
