[stages.202a]
name = "typed boundary replay and complete semantic-seed construction"
# The nine replayed fields include five semantic-key fields and four auxiliary
# evidence fields. Only the five semantic fields enter the 34,565-key review
# universe; route and NDC values never become product semantic keys.
source_fields = [
  "mimiciv_hosp.emar.medication",
  "mimiciv_hosp.emar_detail.product_description",
  "mimiciv_hosp.pharmacy.medication",
  "mimiciv_hosp.prescriptions.drug",
  "mimiciv_hosp.emar_detail.product_description_other",
  "mimiciv_hosp.emar_detail.route",
  "mimiciv_hosp.pharmacy.route",
  "mimiciv_hosp.prescriptions.route",
  "mimiciv_hosp.prescriptions.ndc",
]
statement_unit = "one source field per SQL statement"
typed_null_and_nonnull_remain_distinct = true
normalization_before_hash_allowed = false
sampling_allowed = false
semantic_filtering_allowed = false
semantic_seed_fields = [
  "mimiciv_hosp.emar.medication",
  "mimiciv_hosp.emar_detail.product_description",
  "mimiciv_hosp.pharmacy.medication",
  "mimiciv_hosp.prescriptions.drug",
  "mimiciv_hosp.emar_detail.product_description_other",
]
semantic_seed_contains_only_nonnull_exact_values = true
semantic_seed_contains_review_decisions = false
auxiliary_boundary_fields = [
  "mimiciv_hosp.emar_detail.route",
  "mimiciv_hosp.pharmacy.route",
  "mimiciv_hosp.prescriptions.route",
  "mimiciv_hosp.prescriptions.ndc",
]
product_description_other_sql_null_is_missing_evidence_not_semantic_key = true
hash_match_unit = "each source field separately"

[stages.202b]
name = "complete detail product crosswalk evidence"
selection_rule = "retain every emar_detail row with nonnull product_description, nonnull product_description_other, nonnull product_code, or an exact-linked eMAR head with nonnull medication"
selection_may_use_query200_scope = false
retain_full_typed_detail_tuple_and_multiplicity = true
retain_parent_and_product_rows = true
retain_product_description_product_description_other_product_code_route_and_ordinal = true
adjudication_tuple_fields = [
  "parent_field_ordinal",
  "administration_type",
  "complete_dose_not_given",
  "dose_due",
  "dose_due_unit",
  "dose_given",
  "dose_given_unit",
